<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bedrock Bot Status</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
    }
    .wrap { max-width: 900px; margin: 40px auto; padding: 0 18px; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 14px;
    }
    h1 { margin-top: 0; font-size: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .label { color: #8b949e; font-size: 12px; text-transform: uppercase; }
    .value { margin-top: 6px; font-size: 16px; word-break: break-word; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      color: #ff7b72;
      background: #0d1117;
      padding: 12px;
      border-radius: 6px;
      overflow: auto;
    }
    .dot {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #3fb950;
      margin-right: 8px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1><span class="dot"></span>Bedrock Bot Dashboard</h1>
    <div class="grid">
      <div><div class="label">Status</div><div class="value" id="status">Loading...</div></div>
      <div><div class="label">Auth</div><div class="value" id="auth">-</div></div>
      <div><div class="label">Username</div><div class="value" id="username">-</div></div>
      <div><div class="label">Server</div><div class="value" id="server">-</div></div>
      <div><div class="label">Uptime</div><div class="value" id="uptime">-</div></div>
      <div><div class="label">Reconnects</div><div class="value" id="reconnects">-</div></div>
      <div><div class="label">Player Coordinates</div><div class="value" id="position">Unavailable</div></div>
      <div><div class="label">Block Coordinates</div><div class="value" id="blockPosition">Unavailable</div></div>
      <div><div class="label">Block Name</div><div class="value" id="blockName">Unavailable</div></div>
      <div><div class="label">Last Event</div><div class="value" id="event">-</div></div>
    </div>
  </div>

  <div class="card">
    <div class="label">Last Error</div>
    <pre id="error">None</pre>
  </div>
</div>

<script>
function fmtPos(p) {
  if (!p) return "Unavailable";
  return `X ${Number(p.x).toFixed(2)} | Y ${Number(p.y).toFixed(2)} | Z ${Number(p.z).toFixed(2)}`;
}
function fmtBlock(p) {
  if (!p) return "Unavailable";
  return `X ${p.x} | Y ${p.y} | Z ${p.z}`;
}
function fmtUptime(s) {
  s = Number(s || 0);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${h}h ${m}m ${sec}s`;
}
async function update() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    const d = await r.json();
    document.getElementById("status").textContent = d.status;
    document.getElementById("auth").textContent = d.auth;
    document.getElementById("username").textContent = d.username;
    document.getElementById("server").textContent = d.server;
    document.getElementById("uptime").textContent = fmtUptime(d.uptimeSeconds);
    document.getElementById("reconnects").textContent = d.reconnects;
    document.getElementById("position").textContent = fmtPos(d.position);
    document.getElementById("blockPosition").textContent = fmtBlock(d.blockPosition);
    document.getElementById("blockName").textContent = d.blockName || "Unavailable";
    document.getElementById("event").textContent = d.lastEvent || "-";
    document.getElementById("error").textContent = d.lastError || "None";
  } catch (e) {
    document.getElementById("status").textContent = "Dashboard offline";
  }
}
update();
setInterval(update, 2000);
</script>
</body>
</html>
